name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create tarball
        run: |
          npm pack
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: lsm-ygopro-database-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
